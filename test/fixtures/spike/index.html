<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      .cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      .cam video, .cam img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="spike" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-fps="30">
      <div class="cam" id="cam">
        <video id="clipA" class="clip" src="assets/src.mp4" data-start="0" data-duration="3" data-media-start="2" muted playsinline></video>
        <video id="clipB" class="clip" src="assets/src.mp4" data-start="3" data-duration="2" data-playback-rate="0.5" muted playsinline></video>
        <img id="freeze" class="clip" src="assets/freeze.png" data-start="5" data-duration="1" />
      </div>
      <div id="cardHost" data-composition-id="card" data-composition-src="compositions/card.html" data-start="6" data-duration="2" data-no-timeline></div>
      <audio id="tone" src="assets/tone.mp3" data-start="0.5" data-duration="3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#cam", { x: 0, y: 0, scale: 1 }, 0);
      tl.to("#cam", { scale: 2, x: -1920, y: -180, duration: 1, ease: "power2.inOut" }, 0.5);
      tl.to("#cam", { scale: 1, x: 0, y: 0, duration: 0.5, ease: "power2.inOut" }, 2);
      window.__timelines = window.__timelines || {};
      window.__timelines["spike"] = tl;
    </script>
  </body>
</html>
